services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: melo
      POSTGRES_USER: melo
      POSTGRES_PASSWORD: melo
    ports:
      - "5433:5432"
    volumes:
      - melo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melo -d melo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  melo_postgres: