name: Trigger auto deployment for melocontainerapp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/melocontainerapp-AutoDeployTrigger-910cfda7-a349-446e-8ef2-5c48027c2466.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MELOCONTAINERAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MELOCONTAINERAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MELOCONTAINERAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: melocr-abe9b7f6hef2h9aw.azurecr.io
          registryUsername: ${{ secrets.MELOCONTAINERAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MELOCONTAINERAPP_REGISTRY_PASSWORD }}
          containerAppName: melocontainerapp
          resourceGroup: Melo
          imageToBuild: melocr-abe9b7f6hef2h9aw.azurecr.io/melocontainerapp:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


