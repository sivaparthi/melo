name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_CLIENT_ID: c92e9317-c4a1-4da3-811b-31f14c41bcf2
  AZURE_TENANT_ID: 7ef31e11-917e-4e49-b2fc-0b41303fee6f
  AZURE_SUBSCRIPTION_ID: 4a75dda4-8f2e-41e1-9cdb-683b5e971319
  ACR_NAME: melocr
  ACR_LOGIN_SERVER: melocr-abe9b7f6hef2h9aw.azurecr.io
  IMAGE_NAME: melo
  CONTAINER_APP_NAME: melocontainerapp
  RESOURCE_GROUP: Melo

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Prisma runtime dependency
        run: sudo apt-get update && sudo apt-get install --yes openssl

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace api

      - name: Build shared contracts
        run: npm run build --workspace @emote/contracts

      - name: Lint
        run: |
          npm run lint
          git diff --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Azure
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy image to Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA" \
            --output none

      - name: Verify deployment health
        run: |
          APP_FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "https://$APP_FQDN/health"
